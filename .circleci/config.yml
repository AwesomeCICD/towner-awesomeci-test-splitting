version: 2.1

orbs:
    node: circleci/node@5.0.0
    snyk: snyk/snyk@2.3.0

parameters:
  react-path:
    type: string
    default: "/home/circleci/project/react/"

executors:
  smarter-testing-node: 
    docker:
      - image: cimg/node:24.11.0
    resource_class: small 
    working_directory: /home/circleci/project
    environment:
      CI: "true"
      NODE_OPTIONS: "--no-deprecation"
      TEST_DELAY_MS: "50"
      
      JEST_JUNIT_OUTPUT_DIR: junit
      JEST_JUNIT_OUTPUT_NAME: junit-${CIRCLE_NODE_INDEX}.xml   

jobs:
  smarter-testing-dynamic-split: 
    executor: smarter-testing-node
    parallelism: 2  # reduce to 2 for faster testing
    steps:
      - checkout
      - run:
          name: Debug env vars BEFORE testsuite
          command: |
            echo "=== Environment variables from executor ==="
            echo "JEST_JUNIT_OUTPUT_DIR: $JEST_JUNIT_OUTPUT_DIR"
            echo "JEST_JUNIT_OUTPUT_NAME: $JEST_JUNIT_OUTPUT_NAME"
            echo "CIRCLE_NODE_INDEX: $CIRCLE_NODE_INDEX"
      - run:
          name: Enable Corepack for Yarn 4
          command: corepack enable
      - restore_cache:
          keys:
            - v1-yarn4-deps-{{ checksum "react/.yarnrc.yml" }}-{{ checksum "react/yarn.lock" }}
            - v1-yarn4-deps-
      - run:
          name: Install dependencies with Yarn 4
          command: cd react && yarn install --immutable
      - save_cache:
          key: v1-yarn4-deps-{{ checksum "react/.yarnrc.yml" }}-{{ checksum "react/yarn.lock" }}
          paths:
            - react/node_modules
      - run:
          name: Run tests with Smarter Testing Dynamic Splitting
          command: |
            circleci run testsuite "react-unit-tests-v2"
      - run:
          name: Debug - Check what files were created
          when: always
          command: |
            echo "=== Files in react/junit ==="
            ls -la react/junit/ || echo "Directory does not exist"
      - store_test_results:
          path: react/junit
      - store_artifacts:
           path: react/junit 

workflows:
  test-env-precedence:
    jobs:
      - smarter-testing-dynamic-split:
          name: "smarter-testing-60x-dynamic"
        
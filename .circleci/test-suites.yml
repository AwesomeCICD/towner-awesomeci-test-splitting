name: react-unit-tests
discover: |
  cd react && find src/__tests__ -name "*.test.js" -type f | sort
run: |
  cd react
  mkdir -p junit
  JEST_JUNIT_OUTPUT_FILE="<< outputs.junit >>" yarn test --ci --runTestsByPath --reporters=jest-junit --passWithNoTests << test.atoms >>
outputs:
  junit: react/junit/junit.xml
options:
  dynamic-test-splitting: true
  test-impact-analysis: false